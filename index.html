<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8ed6ff" />
    <title>%GAME_TITLE%</title>
    %PLATFORM_SDK%
    <script>
      window.__wkBootT0 = performance.now();
    </script>
    <style>
      html,body{margin:0;height:100%;background:linear-gradient(#8ed6ff,#dff4ff);overflow:hidden}
      #boot{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;animation:wkshow .2s 1s forwards}
      #boot .bar{width:min(60vw,320px);height:14px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;border:3px solid #fff;box-shadow:0 4px 0 rgba(20,30,60,.2)}
      #boot .bar i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(#ffd75e,#ffb82e);animation:wkload 1.1s ease-in-out infinite}
      @keyframes wkshow{to{opacity:1}}
      @keyframes wkload{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><div class="bar"><i></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
